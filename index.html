<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMORINTH</title>
  <meta name="description" content="AMORINTH — Official." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: #0a0a0a;
      color: #e8dcc8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── SCREENS ── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.75s ease;
      padding: 24px;
    }
    .screen.show {
      opacity: 1;
      pointer-events: all;
    }

    /* ── BACK LINK (shared) ── */
    .back {
      position: fixed;
      top: 32px;
      left: 32px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: #e8dcc8;
      opacity: 0.4;
      cursor: pointer;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: opacity 0.2s;
      z-index: 50;
      user-select: none;
    }
    .back:hover { opacity: 1; }

    /* ── HOME ── */
    #home h1 {
      font-size: clamp(28px, 5vw, 64px);
      font-weight: 300;
      line-height: 1.3;
      text-align: center;
      letter-spacing: 0.01em;
      color: #e8dcc8;
      margin-bottom: 28px;
    }
    #home .sub {
      font-size: clamp(14px, 1.8vw, 20px);
      font-weight: 300;
      color: #e8dcc8;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }
    #home .links {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      font-size: clamp(14px, 1.8vw, 20px);
    }
    #home .links a {
      color: #e8dcc8;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      font-weight: 300;
      transition: opacity 0.2s;
      letter-spacing: 0.02em;
    }
    #home .links a:hover { opacity: 0.55; }
    #home .links .sep { color: #e8dcc8; opacity: 0.35; padding: 0 6px; }

    /* ── FOOTER ── */
    .footer {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: #e8dcc8;
      opacity: 0.25;
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 5;
    }

    /* ── CINEMA ── */
    #cinema {
      background: #000;
      padding: 0;
    }
    #cinema video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
    @media (max-width: 600px) {
      #cinema video {
        object-position: center center;
      }
    }
    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }

    /* ── CONTACT ── */
    #contact {
      background: #000;
    }
    #contact h2 {
      font-size: clamp(14px, 1.8vw, 22px);
      font-weight: 300;
      color: #e8dcc8;
      text-align: center;
      margin-bottom: 16px;
      letter-spacing: 0.04em;
      opacity: 0.5;
    }
    #contact a.tg-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(40px, 8vw, 90px);
      font-weight: 300;
      color: #e8dcc8;
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 8px;
      letter-spacing: 0.06em;
      transition: opacity 0.2s;
      display: block;
    }
    #contact a.tg-btn:hover { opacity: 0.5; }

    /* ── UPDATES ── */
    #updates {
      background: #0a0a0a;
      text-align: center;
    }
    .upd-statement {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 6vw, 80px);
      font-weight: 400;
      letter-spacing: 0.1em;
      line-height: 1.2;
      color: #c8ff00;
      max-width: 820px;
    }

  </style>
</head>
<body>

  <!-- HOME -->
  <div class="screen show" id="home">
    <h1>Aap log enjoy toh<br/>kar rahe ho na?</h1>
    <p class="sub">Nahi kya? Kya chahiye?</p>
    <div class="links">
      <a id="go-updates">Updates?</a>
      <span class="sep">|</span>
      <a id="go-contact">Contact?</a>
    </div>
  </div>

  <!-- CINEMA -->
  <div class="screen" id="cinema">
    <video id="cin-video" src="amorinth_video.mp4" playsinline preload="auto" muted></video>
    <audio id="cin-audio" src="amorinth_audio.mp3" preload="auto"></audio>
    <div id="flash"></div>
  </div>

  <!-- CONTACT -->
  <div class="screen" id="contact">
    <span class="back" id="back-contact">&larr; Wapas</span>
    <h2>Contact me here</h2>
    <a class="tg-btn" href="https://t.me/AMORINTH" target="_blank" rel="noopener">AMORINTH</a>
  </div>

  <!-- UPDATES -->
  <div class="screen" id="updates">
    <span class="back" id="back-updates">&larr; Wapas</span>
    <div class="upd-statement">AMORINTH: THE PAST IS ERASED.<br/>THE FUTURE IS MINE.</div>
  </div>

  <!-- FOOTER -->
  <div class="footer">&copy; 2025 AMORINTH</div>

  <script>
    'use strict';
    const $ = id => document.getElementById(id);

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
      $(id).classList.add('show');
    }

    $('go-updates').addEventListener('click', () => show('updates'));
    $('back-updates').addEventListener('click', () => show('home'));
    $('back-contact').addEventListener('click', () => show('home'));

    $('go-contact').addEventListener('click', () => {
      show('cinema');
      const vid = $('cin-video');
      const aud = $('cin-audio');
      const flash = $('flash');

      vid.currentTime = 0;
      aud.currentTime = 0;
      vid.play().catch(() => {});
      aud.play().catch(() => {});

      function doFlash() {
        aud.pause();
        vid.pause();
        flash.style.transition = 'none';
        flash.style.opacity = '1';
        setTimeout(() => {
          flash.style.transition = 'opacity 0.6s ease';
          flash.style.opacity = '0';
          setTimeout(() => show('contact'), 700);
        }, 120);
      }

      vid.onended = doFlash;
      $('cinema').addEventListener('click', doFlash, { once: true });
    });
  </script>

</body>
</html>
